    <meta name="author" content="Bringas Insurance Group" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["InsuranceAgency", "Organization"],
        "@id": "https://bringasinsurance.com/#organization",
        "name": "Bringas Insurance Group",
        "url": "https://bringasinsurance.com/",

        "telephone": "+1-425-405-7111",
        "address": {

          "streetAddress": "9111 Evergreen Way",

          "postalCode": "98204",
          "addressCountry": "US"
        },
        "areaServed": { "@type": "State", "name": "Washington" },
        "knowsLanguage": ["English", "Spanish"],
        "sameAs": [
          "https://www.facebook.com/Bringas-Insurance-111132600590435/",
          "https://www.linkedin.com/in/bringas-insurance-54111bb1/",
          "https://twitter.com/BringasIns",

        ]
      }
    </script>
    <!-- Canonical is set per-route via src/components/SEO.tsx (react-helmet-async).
         A static site-wide canonical made every unknown/spam URL canonicalize to "/". -->

    <meta name="theme-color" content="#0079c2" />

    <meta property="og:type" content="website" data-rh="true" />
    <meta property="og:url" content="https://bringasinsurance.com/" data-rh="true" />
    <meta property="og:title" content="Bringas Insurance Group" data-rh="true" />
    <meta property="og:description" content="We Bring You Insurance Solutions." data-rh="true" />

    <meta name="twitter:card" content="summary_large_image" data-rh="true" />
    <meta name="twitter:site" content="@BringasIns" data-rh="true" />
    <meta name="twitter:title" content="Bringas Insurance Group" data-rh="true" />
    <meta name="twitter:description" content="We Bring You Insurance Solutions." data-rh="true" />
    <meta name="twitter:image" content="https://bringasinsurance.com/bringas-insurance-logo.png" data-rh="true" />

    <!-- Fonts: non-blocking with swap, single combined request -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" />
    </noscript>

    <!-- Google Analytics: deferred until idle to reduce TBT -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // Page views are sent by React only after confirming the route exists.
      // This prevents the SPA fallback from counting 404/410 pages as content.
      gtag('config', 'G-5QM8V0WQ00', { send_page_view: false });
      (function(){
        var loaded = false;
        function loadGA(){
          if (loaded) return; loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-5QM8V0WQ00';
          document.head.appendChild(s);
        }
        // Load soon after first paint so short sessions are still counted.
        if (document.readyState === 'complete') {
          setTimeout(loadGA, 300);
        } else {
          window.addEventListener('load', function(){ setTimeout(loadGA, 300); });
        }
        // Safety net: never wait more than 2s, even if load fires late.
        setTimeout(loadGA, 2000);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
